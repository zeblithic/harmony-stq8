[package]
name = "stq8-web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "WASM bindings for STQ8 speech-to-Q8 pipeline"

[lib]
crate-type = ["cdylib"]

[dependencies]
stq8-core = { path = "../stq8-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
js-sys = "0.3"
